[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opmodel"
version = "0.1.0"
description = "Standalone per-operation accelerator performance prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "matplotlib>=3.8",
]
research = [
  "matplotlib>=3.8",
]

[project.scripts]
opmodel = "opmodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opmodel = ["configs/hardware/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
