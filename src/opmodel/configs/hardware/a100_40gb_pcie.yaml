name: a100_40gb_pcie
kind: gpu
# Minimum measured average power from EnergAIzer database/data yz8_*freq900*.csv.
static_power_w: 47.939551350932

# Derived from EnergAIzer config/gpu/yz8.yaml.
# Peak FLOPs are scaled from sm_max_freq=1410 MHz to the measured LUT
# operating point sm_freq=900 MHz. Energy coefficients are first-pass values
# derived from power_cap divided by the corresponding peak throughput.
compute:
  clock_hz: 9.0e8
  # Calibrated from median small/small-skinny GEMM residuals at 900 MHz.
  device_fixed_overhead_cycles: 22400
  num_sms: 108
  # NVIDIA Ampere CC 8.0 supports up to 164 KiB shared memory per SM.
  shared_memory_bytes_per_sm: 167936
  fma_dims: [16, 8, 16]
  dataflow: output_stationary
  vector_flops_per_s:
    fp64: 6.191489361702128e12
    fp32: 1.2446808510638299e13
    bf16: 1.2446808510638299e13
  tensor_flops_per_s:
    fp64: 1.2446808510638299e13
    tf32: 9.957446808510639e13
    bf16: 1.9914893617021278e14
    fp16: 1.9914893617021278e14
    int8: 3.9829787234042556e14
  vector_energy_j_per_flop:
    fp64: 4.037800687285223e-11
    fp32: 2.0085470085470086e-11
    bf16: 2.0085470085470086e-11
  tensor_energy_j_per_flop:
    fp64: 2.0085470085470086e-11
    tf32: 2.5106837606837607e-12
    bf16: 0.7e-12 # 1.2553418803418803e-12
    fp16: 0.7e-12 # 1.2553418803418803e-12
    int8: 6.276709401709402e-13

memory:
  levels:
    - name: l2
      size_bytes: 41943040
      bandwidth_bytes_per_s: 4.608e12
      energy_j_per_byte: 3.768e-11 # 5.425347222222222e-11
    - name: sram
      # 164 KiB/SM * 108 SMs. Bandwidth is inferred from 32 shared-memory
      # banks * 4 B/bank/cycle/SM at the 900 MHz modeled clock.
      size_bytes: 18137088
      bandwidth_bytes_per_s: 1.24416e13
      energy_j_per_byte: 1.272e-11
      bank_count: 32
      bank_width_bytes: 4
    - name: hbm
      size_bytes: 42949672960
      bandwidth_bytes_per_s: 1.555e12
      energy_j_per_byte: 1.0488e-10 # 1.607717041800643e-10

utilization:
  vector: 1.0
  tensor: 1.0
  memory:
    hbm: 1.0
    l2: 1.0
