name: a10
kind: gpu
# Minimum measured average power from EnergAIzer database/data a10_*freq900*.csv.
static_power_w: 41.710332745228

# Derived from EnergAIzer config/gpu/a10.yaml.
# Peak FLOPs are scaled from sm_max_freq=1695 MHz to the measured LUT
# operating point sm_freq=900 MHz. Energy coefficients are first-pass values
# derived from power_cap divided by the corresponding peak throughput.
compute:
  clock_hz: 9.0e8
  # Calibrated from median small/small-skinny GEMM residuals at 900 MHz.
  device_fixed_overhead_cycles: 15000
  num_sms: 72
  # NVIDIA Ampere CC 8.6 supports up to 100 KiB shared memory per SM.
  shared_memory_bytes_per_sm: 102400
  fma_dims: [16, 8, 16]
  dataflow: output_stationary
  vector_flops_per_s:
    fp32: 1.6566371681415932e13
    bf16: 1.6566371681415932e13
    fp16: 1.6566371681415932e13
  tensor_flops_per_s:
    bf16: 6.637168141592921e13
    fp16: 6.637168141592921e13
  vector_energy_j_per_flop:
    fp32: 9.054487179487179e-12
    bf16: 9.054487179487179e-12
    fp16: 9.054487179487179e-12
  tensor_energy_j_per_flop:
    bf16: 2.2599999999999997e-12
    fp16: 2.2599999999999997e-12

memory:
  levels:
    - name: l2
      size_bytes: 6291456
      bandwidth_bytes_per_s: 4.608e12
      energy_j_per_byte: 3.2552083333333334e-11
    - name: sram
      # 100 KiB/SM * 72 SMs. Bandwidth is inferred from 32 shared-memory
      # banks * 4 B/bank/cycle/SM at the 900 MHz modeled clock.
      size_bytes: 7372800
      bandwidth_bytes_per_s: 8.2944e12
      energy_j_per_byte: 1.272e-11
      bank_count: 32
      bank_width_bytes: 4
    - name: hbm
      size_bytes: 25769803776
      bandwidth_bytes_per_s: 6.0e11
      energy_j_per_byte: 2.5e-10

utilization:
  vector: 1.0
  tensor: 1.0
  memory:
    hbm: 1.0
    l2: 1.0
